<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}

.leaflet-tile::selection {
	background: transparent;
}

.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}

.leaflet-safari .leaflet-tile-container {

	height: 1600px;

	}
.leaflet-marker-icon,
.leaflet-marker-shadow {

	}

.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;

	}
.leaflet-container .leaflet-marker-pane img,

.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {

	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;

}

	touch-action: none;
}

}
.leaflet-container a {

}

	}

	}

	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {

	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }

/* control positioning */

.leaflet-control {

	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {

.leaflet-top {

.leaflet-bottom {
	bottom: 0;

.leaflet-left {

/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {

	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {

	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);

.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {

.leaflet-interactive {

.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,

.leaflet-container {

	}

	}
.leaflet-zoom-box {

/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;

	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;

	}
.leaflet-bar a,
.leaflet-control-layers-toggle {

	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {

	}
.leaflet-bar a:first-child {

	}
.leaflet-bar a:last-child {

.leaflet-touch .leaflet-bar a {

/* attribution and scale controls */

.leaflet-touch .leaflet-control-attribution,

.leaflet-popup {

.leaflet-popup-content-wrapper {

.leaflet-oldie .leaflet-popup-content-wrapper {

.leaflet-oldie .leaflet-popup-tip {

.leaflet-oldie .leaflet-control-zoom,

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;

	color: #222;

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;

<style>
/* Layout: mapa a pantalla completa; barra de filtros arriba; hoja inferior para ficha y listado */
:root{
  --bg:#f3f4f2; --paper:#ffffff; --ink:#22262b; --mute:#6c737c; --line:#e3e6e9; --soft:#f4f5f6;
  --street:#dcdfe3; --street-label:#8b929a; --pin:#d9432f; --pin-edge:#ffffff; --sel:#22262b; --warn:#9a6a12; --warn-bg:#fbf3e2;
  --f:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
#map{position:fixed;inset:0;background:var(--bg);z-index:0}
.leaflet-container{background:var(--bg);font-family:var(--f)}
.leaflet-control-attribution{display:none}
.top{position:fixed;z-index:1000;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 14px;background:linear-gradient(var(--paper) 72%,rgba(255,255,255,0))}
.head{display:flex;justify-content:space-between;align-items:center;padding:0 16px;margin-bottom:10px;gap:12px}
.head h1{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em}
.count{font-size:13.5px;font-weight:500;color:var(--mute);background:var(--soft);padding:6px 11px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{color:var(--ink);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer}
.chip span{color:var(--mute);margin-left:5px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] span{color:rgba(255,255,255,.6)}
.fab{position:fixed;z-index:1000;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:13px 22px;font-size:15px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;display:flex;gap:8px;align-items:center}
.zoom{position:fixed;z-index:1000;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.zoom button{width:44px;height:44px;border:0;background:var(--paper);font-size:22px;font-weight:400;cursor:pointer}
.zoom button+button{border-top:1px solid var(--line)}
.sheet{position:fixed;z-index:1100;left:0;right:0;bottom:0;background:var(--paper);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.12);padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 20px);max-height:70%;overflow:auto;max-width:560px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-size:18px;cursor:pointer;color:var(--mute)}
.card+.card{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.addr{margin:0 44px 4px 0;font-size:20px;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
.who{font-size:15.5px;margin:0 0 6px}
.meta{font-size:13.5px;color:var(--mute);margin:0 0 12px}
.obs{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:0 0 12px;line-height:1.4}
.obs small{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.warn{display:inline-block;font-size:12.5px;font-weight:500;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:4px 9px;margin:0 0 12px}
.go{display:block;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:15.5px;font-weight:500;color:var(--ink);background:var(--paper)}
.go:active{background:var(--soft)}
.many{font-size:13px;color:var(--mute);margin:0 0 10px}
.list{position:fixed;z-index:1100;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 108px);background:var(--paper);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.12);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.lh{padding:10px 18px 12px;border-bottom:1px solid var(--line);position:relative}
.lh h2{margin:0 44px 2px 0;font-size:17px;font-weight:500}
.lh p{margin:0 0 10px;font-size:13.5px;color:var(--mute)}
.search{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 12px;font-size:15px;outline:none}
.search:focus{border-color:var(--mute);background:var(--paper)}
.items{overflow:auto;flex:1;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.grp{position:sticky;top:0;background:var(--soft);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:7px 18px;font-weight:500}
.it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--paper);padding:12px 18px;border-bottom:1px solid var(--soft);cursor:pointer}
.it:active{background:var(--soft)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pin);flex:none}
.it .t{flex:1;min-width:0}
.it .a{display:block;font-size:15.5px;font-weight:500}
.it .s{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--mute);flex:none}
.empty{padding:24px 18px;color:var(--mute)}
.lbl{font-size:10.5px;color:var(--street-label);white-space:nowrap;pointer-events:none;font-weight:500;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.lbl div{transform-origin:center;display:inline-block;transform:translate(-50%,-50%)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  ${p.n?`<p class="who">${esc(p.n)}</p>`:''}
  <p class="meta">Barrio ${esc(p.b)} · ${esc(p.a)}</p>
  ${p.x?`<span class="warn">Ubicación aproximada sobre la calle</span>`:''}
  ${p.o?`<div class="obs"><small>Observación</small>${esc(p.o)}</div>`:''}
  <a class="go" href="https://www.google.com/maps/dir/?api=1&destination=${p.la},${p.lo}" target="_blank" rel="noopener">Cómo llegar</a></article>`;
}
function openCard(p){
  const list=near(p); highlight(list);
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<div class="grab"></div><button class="x" id="closeCard" aria-label="Cerrar">✕</button>`+
    (list.length>1?`<p class="many">${list.length} domicilios en este punto</p>`:'')+list.map(cardHTML).join('');
  sh.hidden=false; sh.scrollTop=0;
  document.getElementById('closeCard').onclick=closeCard;
  document.getElementById('openList').hidden=true;
}
function closeCard(){
  highlight([]); document.getElementById('sheet').hidden=true; document.getElementById('openList').hidden=false;
}

const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function renderList(){
  const q=norm(document.getElementById('q').value.trim());
  const v=visible();
  document.getElementById('lt').textContent=area?`${area} · ${v.length} domicilios`:`Todas las áreas · ${v.length} domicilios`;
  document.getElementById('ls').textContent=area?'Ordenado por barrio y calle':'Agrupado por área programática';
  const f=v.filter(p=>!q||norm(p.d+' '+p.n+' '+p.b).includes(q));
  const key=p=>area?p.b:p.a;
  const sorted=f.slice().sort((x,y)=>key(x).localeCompare(key(y),'es')||x.d.localeCompare(y.d,'es',{numeric:true}));
  let html='',g=null;
  for(const p of sorted){
    if(key(p)!==g){g=key(p);html+=`<div class="grp">${esc(g)}</div>`}
    html+=`<button class="it" data-id="${p.id}"><span class="dot"></span><span class="t"><span class="a">${esc(p.d)}</span><span class="s">${esc([p.n,area?'':p.b].filter(Boolean).join(' · ')||p.b)}</span></span><svg class="chev" width="8" height="14" viewBox="0 0 8 14" aria-hidden="true"><path d="M1 1l6 6-6 6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>`;
  }
  document.getElementById('items').innerHTML=html||`<div class="empty">No hay domicilios que coincidan con “${esc(document.getElementById('q').value)}”.</div>`;
}
document.getElementById('items').addEventListener('click',e=>{
  const b=e.target.closest('.it'); if(!b)return; const p=byId[b.dataset.id];
  document.getElementById('list').hidden=true;
  const pt=map.project([p.la,p.lo],18).add([0,window.innerHeight*0.28]);
  map.flyTo(map.unproject(pt,18),18,{duration:.6}); openCard(p);
});
document.getElementById('q').addEventListener('input',renderList);
document.getElementById('openList').onclick=()=>{document.getElementById('list').hidden=false;renderList()};
document.getElementById('closeList').onclick=()=>{document.getElementById('list').hidden=true};

render(); syncLabels();
</script>
